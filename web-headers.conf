# Headers for HTML / web-frontend responses (fdk-portal, data-norge-frontend, static-rdf).
# nginx's add_header does not inherit when any add_header is set at a deeper level,
# so this file is included at every location that overrides server-level headers
# (typically by setting Content-Security-Policy).
add_header Strict-Transport-Security 'max-age=31536000; includeSubDomains; preload;' always;
add_header X-Content-Type-Options 'nosniff' always;
add_header Referrer-Policy 'strict-origin-when-cross-origin' always;
add_header 'Vary' 'Accept, Accept-Encoding' always;
add_header Cache-Control 'max-age=900, public' always;